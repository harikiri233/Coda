[project]
name = "coda"
version = "0.1.0"
description = "Coda：面向国产大模型的终端 Coding Agent（Textual TUI）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.2.0",
    "openai==3.22.1",
    "pathspec==1.1.1",
    "pydantic==2.13.5",
    "rich==15.0.0",
    "textual==8.2.8",
    "typer==0.27.2",
]

[project.scripts]
coda = "coda.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coda"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# 行长度交给 ruff format 处理；中文按双倍宽度计算，含中文的字符串无法自动折行
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
